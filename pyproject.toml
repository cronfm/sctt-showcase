[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sctt-showcase"
version = "0.1.0"
description = "A synthetic SCTT localization API and interactive PyTorch 3D showcase"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "scronfm"}]
dependencies = [
  "torch>=2.4,<3",
  "numpy>=1.26,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "plotly>=5.24,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1.2,<2"]
pytorch3d = ["iopath>=0.1.10", "fvcore>=0.1.5", "matplotlib>=3.8"]
notebook = ["jupyterlab>=4.3,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "matplotlib>=3.8,<4"]

[project.scripts]
sctt-showcase = "sctt_showcase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sctt_showcase"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "sctt_showcase/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
